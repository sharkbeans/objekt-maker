<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO and Social Meta Tags -->
    <title>Objekts</title>
    <meta name="author" content="Objekts">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourusername.github.io/photocard-maker/">
    <meta property="og:description" content="Create beautiful custom photocards with borders, frames, and text overlays.">
    <meta property="og:image" content="https://yourusername.github.io/photocard-maker/assets/icons/preview.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://yourusername.github.io/photocard-maker/">
    <meta property="twitter:title" content="Photocard Maker - Create Custom Photocards">
    <meta property="twitter:description" content="Create beautiful custom photocards with borders, frames, and text overlays.">
    <meta property="twitter:image" content="https://yourusername.github.io/photocard-maker/assets/icons/preview.png">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="alternate icon" href="assets/icons/favicon.ico">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h4></h4>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Controls Panel -->
            <aside class="controls-panel">
                <section class="control-section">
                    <h2 class="section-title">📸 Upload Image</h2>
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="imageUpload" accept="image/png,image/jpeg,image/jpg" hidden>
                        <label for="imageUpload" class="upload-label">
                            <span class="upload-icon">⬆️</span>
                            <span class="upload-text">Click to upload or drag image here</span>
                            <span class="upload-hint">JPG or PNG, max 5MB</span>
                        </label>
                    </div>
                </section>

                <section class="control-section">
                    <h2 class="section-title">🔧 Adjustments</h2>
                    <div class="adjustment-controls">
                        <label>
                            <span>Zoom:</span>
                            <input type="range" id="zoomSlider" min="50" max="200" value="100" step="5">
                            <span id="zoomValue">100%</span>
                        </label>
                        <label>
                            <span>Pan X:</span>
                            <input type="range" id="panXSlider" min="-300" max="300" value="0" step="5">
                            <span id="panXValue">0px</span>
                        </label>
                        <label>
                            <span>Pan Y:</span>
                            <input type="range" id="panYSlider" min="-300" max="300" value="0" step="5">
                            <span id="panYValue">0px</span>
                        </label>
                    </div>
                </section>
                
                <section class="control-section">
                    <h2 class="section-title">🎨 Notch Color</h2>
                    <div class="adjustment-controls">
                        <!-- Notch Color Dropdown: Select from categorized color presets -->
                        <label>
                            <span>Category:</span>
                            <select id="notchColorGroupSelect" class="dropdown-select"></select>
                        </label>

                        <!-- Notch Color Options: Dropdown list of colors in selected category -->
                        <label>
                            <span>Color:</span>
                            <div class="color-dropdown-wrapper">
                                <!-- Color preview square displayed on the left -->
                                <div id="notchColorPreview" class="notch-color-preview"></div>
                                <select id="notchColorSelect" class="dropdown-select dropdown-with-preview">
                                    <option value="">Select a color</option>
                                </select>
                            </div>
                        </label>

                        <!-- Manual Hex Input: For custom colors -->
                        <label>
                            <span>Custom Hex:</span>
                            <input type="text" id="borderColorHex" value="#FFD400" class="text-input color-hex-input" placeholder="#FFD400" maxlength="7">
                        </label>
                    </div>
                </section>
                <!-- Border -->
                <section class="control-section">
                    <h2 class="section-title">🖼️ Border Image</h2>
                    <div class="adjustment-controls">
                        <div class="border-image-upload">
                            <input type="file" id="borderImageUpload" accept="image/png,image/jpeg,image/jpg" hidden>
                            <label for="borderImageUpload" class="btn btn-secondary btn-small">
                                📁 Upload Border Image
                            </label>
                            <button id="clearBorderImage" class="btn btn-secondary btn-small" style="display: none;">
                                ✕ Clear Image
                            </button>
                        </div>
                        <p class="upload-hint">Upload an image to replace the colored border</p>
                    </div>
                </section>

                <section class="control-section">
                    <h2 class="section-title">✏️ Text</h2>
                    <div class="adjustment-controls">
                        <label>
                            <span>Top Text:</span>
                            <input type="text" id="topText" value="SeoYeon" class="text-input">
                        </label>
                        <label>
                            <span>Middle Text:</span>
                            <input type="text" id="middleText" value="100A" class="text-input">
                        </label>
                        <label>
                            <span>Bottom Text:</span>
                            <input type="text" id="bottomText" value="tripleS" class="text-input">
                        </label>
                        <label>
                            <span>Text Color:</span>
                            <div class="color-input-group">
                                <input type="color" id="textColorPicker" value="#000000" class="color-picker">
                                <input type="text" id="textColorHex" value="#000000" class="text-input color-hex-input" placeholder="#000000" maxlength="7">
                            </div>
                        </label>
                        <div class="color-presets">
                            <span class="presets-label">Presets:</span>
                            <div class="preset-colors">
                                <button class="preset-color-text" data-color="#000000" style="background-color: #000000;" title="#000000"></button>
                                <button class="preset-color-text" data-color="#FFFFFF" style="background-color: #FFFFFF; border: 1px solid #333;" title="#FFFFFF"></button>
                                <button class="preset-color-text" data-color="#FF0000" style="background-color: #FF0000;" title="#FF0000"></button>
                                <button class="preset-color-text" data-color="#00FF00" style="background-color: #00FF00;" title="#00FF00"></button>
                                <button class="preset-color-text" data-color="#0000FF" style="background-color: #0000FF;" title="#0000FF"></button>
                                <button class="preset-color-text" data-color="#FFD400" style="background-color: #FFD400;" title="#FFD400"></button>
                                <button class="preset-color-text" data-color="#FF6B9D" style="background-color: #FF6B9D;" title="#FF6B9D"></button>
                                <button class="preset-color-text" data-color="#9D4EDD" style="background-color: #9D4EDD;" title="#9D4EDD"></button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="control-section">
                    <button id="exportBtn" class="btn btn-primary btn-large">💾 Download Image</button>
                    <button id="resetBtn" class="btn btn-secondary">🔄 Reset</button>
                </section>
            </aside>

            <!-- Canvas Area -->
            <div class="canvas-container">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="mainCanvas" width="768" height="1186"></canvas>
                </div>
                <div class="canvas-placeholder" id="canvasPlaceholder">
                    <p>Upload an image to get started</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Photocard Maker | All processing happens in your browser</p>
        </div>
    </footer>

    <!-- JavaScript Modules -->
    <script src="js/canvas.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
